[package]
name = "d2r-map-overlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Read-only Diablo II: Resurrected minimap overlay for Hyprland (Linux, Proton)"
publish = false

[dependencies]
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
anyhow = "1.0.104"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"
cast_possible_truncation = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
