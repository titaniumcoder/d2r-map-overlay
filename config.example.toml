# d2r-map-overlay configuration (optional).
# Copy to $XDG_CONFIG_HOME/d2r-map-overlay/config.toml (usually ~/.config/d2r-map-overlay/config.toml).
# Read once at start. Missing file or key: the defaults below. An invalid file is reported on
# stderr and the defaults are used. This example spells out the defaults.

[valuables]
# Ground drops matched by research/valuables.json get a ring around their marker, coloured by
# tier: S red, A orange, B yellow; dashed when the match is uncertain (unique/set name unknown,
# or the item's stats decide). List the tiers to highlight per category ("S", "A", "B").
# trade = items worth selling, tradable runeword bases included (e.g. a 4os Monarch);
# twink = white runeword bases for the player's own characters (e.g. a 4os Crystal Sword).
# A plain base with no enabled match isn't shown at all.
trade = ["S", "A"]
twink = ["S", "A"]

[shrines]
# Shrine types to show (unused ones near the player). Names, lowercase: none, refilling, health, mana,
# health exchange, mana exchange, armor, combat, resist fire, resist cold, resist lightning,
# resist poison, skill, mana recharge, stamina, experience, enirhs, portal, gem, fire, monster,
# exploding, poison. Unknown names are reported and ignored. show = [] shows none.
# Map labels by type: REF refilling, HLT health, MNA mana, HEX health exchange, MEX mana exchange,
# ARM armor, CMB combat, RFI resist fire, RCO resist cold, RLI resist lightning, RPO resist poison,
# SKL skill, MRC mana recharge, STA stamina, EXP experience, ENI enirhs, POR portal, GEM gem,
# FIR fire, MON monster, XPL exploding, POI poison (NON none).
show = ["refilling", "skill", "stamina", "gem", "monster"]
# Of those, types shown in Normal only (hidden in Nightmare and Hell).
normal_only = ["stamina"]

[builds]
# Each character's damage types, primary first, by character name (any case): from Nightmare on,
# the info line's monster levels turn red in areas bad for the build (35 % or more of the monster
# types immune to the primary damage, or any type immune to all of them) and green where none is
# immune to the primary damage. Damage names: physical, fire, cold, lightning, poison, magic.
# Unknown names are reported and ignored. No entry: no colouring.
# Vex = ["lightning", "fire", "physical"]

# [builds.class]
# Fallback by class for characters not listed above: a class name (amazon, sorceress, necromancer,
# paladin, barbarian, druid, assassin) or its id 0..6.
# druid = ["physical"]
# necromancer = ["physical"]

# [bis.<character>]: the agent-authored build definition to chase for that character
# (user request, 2026-11-17). The gear itself lives in `builds/<slug>.toml` next to this file
# (one build per file, authored by the agent; see `builds/summoner-druid.toml`). Resolution order:
# inline slots (legacy, below) if present, else the selected build — or, without a selection, the
# build marked `default_for_class` for the character's class — at its current guide stage, else none.
# Stages chain through the build files' `next` (switched here on the config page, or automatically
# by level where a build sets `auto_switch`).
#
# [bis.Demonmaster]
# build = "blood boil"
#
# Legacy inline slots (the webapp no longer edits them; they win over the build's):
#
# [bis.Demonmaster.slots]
# weapon = ["Mang Song's Lesson@82", "Heart of the Oak@55"]

# farm.toml (a separate file next to this one, agent-authored; the app only reads it): a
# cross-character farm list, shown as the dashboard's "Farm list" panel. Gear for a planned
# build, farmed with other characters. Hot-reloaded like this file. Missing: no panel; invalid:
# reported once on stderr, no panel.
#
# [[farm]]
# for = "Fury Druid"
# items = [
#   { name = "Fortitude", kind = "runeword", slot = "body" },
#   { name = "Raven Frost", kind = "unique" },
#   { name = "Lawbringer", kind = "runeword", count = 2 },
#   { name = "Bulwark", kind = "runeword", merc = true, slot = "helm" },
# ]
#
# kind: runeword, unique or set (by in-game name); count defaults to 1. Optional, for a
# runeword's base hint: `merc = true` (for the mercenary, taken as Act 2: no class-only bases,
# polearm/spear weapons; with slot = helm or body, bases ranked by defense) and `slot` (weapon, shield or
# offhand, helm, body, gloves, boots, belt, amulet, ring: only bases of that slot; left out,
# any slot the runeword allows). An entry is done once
# the shared stash holds `count` copies, found while the played character carries one
# elsewhere, else missing. A runeword still to build lists its runes, and the stash panel's
# rune stacks mark (⚑) the runes the list still needs.
