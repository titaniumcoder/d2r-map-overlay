# instead of editing by hand. Setups: starter / standard = the guide's variants (or the
# leveling stage, 'lvl a-b'), everything else folds as alternative.
name = "Fury Druid"
damages = ["physical"]
notes = "Fury Werewolf from level 1 to 99 in one build: no stage switch, no skill reset. Leveling gear by level (two-handed from level 1, natural-socket bases only, twinked by Vex), then the user's endgame core (Eternity / Breath of the Dying, Fortitude, Jalal's Mane, Laying of Hands, Raven Frost; the merc's 2x Lawbringer, Smoke, Bulwark). Merc: an Act 1 Cold Arrow rogue until Normal Act 5, then the Act 5 Frenzy Barbarian. Durations, breakpoints and skill order computed from the D2R game tables, not from a guide."
targets = ["Lycanthropy duration: Werewolf form lasts 1000 + Lycanthropy(1000 + 500 per level after the first) frames: 40 s without Lycanthropy, 80 s at 1, +20 s per level, 180 s at 6, 300 s (5 min) at 12, 460 s at 20. Form life bonus 25% + Lycanthropy (20% + 5% per level): 45% at 1, 100% at 12, 140% at 20. Levels include +skills: 4 hard points by ~30 with the Eye of Etlich (+1) and Lore (+1) are level 6 = 180 s; Jalal's Mane (+2 druid, +2 Shape Shifting) adds 4 more from 42.", "Werewolf: Werewolf attack speed (skill IAS, diminishing 10..80): 20 at 1, 45 at 5, 51 at 7, 57 at 10, 64 at 15, 68 at 20; attack rating +50% +15% per level (335% at 20).", "Feral rage: Feral Rage (level 12): max charges 3 + level/2 (3 at 1, 4 at 2-3, 5 at 4, 8 at 10, 13 at 20); 4% life steal per charge (12/16/20/32/52%), run speed up to 32-55%, charges last 20 s. Life steal is divided by 2 in Nightmare and 3 in Hell (difficultylevels.json). The skill screen formula shows 4 to 4x level + 8% (equal to the charge formula only at levels 1-2): trust the screen in game.", "Fury: Fury (level 30, needs Rabies > Feral Rage > Werewolf): min(level + 1, 5) hits, so 5 hits from level 4; damage +100% +17% per level (423% at 20); attack rating +50% +10% per level. The current skills.json gives Fury no synergy, so 20 hard points is all of its scaling.", "Skill order: One line 1-99, 110 points (98 levels + 12 quest points); a skill holds at most character level - its required level + 1 hard points: 2-11 Werewolf 10 and Lycanthropy 1 (Den of Evil); 12-29 Feral Rage 10 (its leech is full in Normal), Rabies 1 at 18, Lycanthropy to 4 hard points (effective 6 with +skills), Werewolf to 17 with Izual's points; 30-49 Fury one point per level, 20 at 49 (all of its scaling, no synergy), the Nightmare quest points finishing Werewolf 20 and starting Lycanthropy; then Lycanthropy 20, Feral Rage 20 (13 charges, 52% life steal, 17% in Hell), Oak Sage 1 and Heart of Wolverine 20 (it replaces Oak Sage); last Werebear 1 and Maul 1 (for a Metamorphosis), the 6 left into Rabies (7).", "IAS: Werewolf attack frames (Feral Rage, normal attack, Fury's first hit), by effective Werewolf level and off-weapon IAS. Ribcracker (WSM 0, its 50% IAS counts undiminished in wolf form): 6 frames at Werewolf 1-2, 5 frames from Werewolf 3 with no other IAS (fastest of all candidates). Fury's middle hits roll the animation back 70% and are shorter; the tables can't give that sequence exactly.", "Core fit: From the data: Ribcracker is a two-handed Quarterstaff (level 31, 25 Str), 5 frames thanks to its 50% weapon IAS; Hone Sundan with 3 Shael (level 37, 101 Str) is 5 frames too with 45% crushing blow. The druid fights two-handed only (never one-handed, no shield). Lawbringer is one-handed (sword/hammer/scepter, level 43): both copies go to the Act 5 Frenzy merc that dual-wields one-handed swords. Smoke is always merc gear (the druid wears Stealth, Lionheart, then Fortitude); Bulwark goes to the merc when Jalal's Mane (a druid pelt) comes at 42. Laying of Hands (Bramble Mitts, level 63, 20% IAS) is part of The Disciple set.", "Physical immunes: Fury only deals physical damage: skip physical immunes or leave them to the merc and Rabies (poison); each of the merc's Lawbringers adds 150-210 fire and 130-180 cold.", "Merc: Act 1 Cold Arrow rogue from Act 1 until Normal Act 5 (bows: Pluckeye, Witherstring / Rimeraven, Zephyr, Edge; Isenhart's Horns, Greyform), then the Act 5 Frenzy Barbarian from Normal Act 5 on (no rehire): Strength + King's Grace, Coldsteel Eye from 31, Undead Crown, Smoke at 37, the druid's Bulwark at 42, 2x Lawbringer at the endgame; later, once Bone Break (unique charm) is owned, an Act 2 Might merc with Pride. No Act 2 merc while leveling — hireling.json: the rogue is hireable from level 3, the Frenzy Barbarian (his own hire type) from Normal Act 5 at 28+; he is the same type as the endgame 2x Lawbringer merc, so there's no rehire. Act 2 Might (the aura on top of Fury's physical damage) only after Bone Break, since only with it does Fury hit physical immunes without the Lawbringers' Decrepify."]
class = "druid"
default_for_class = true
merc_acts = [5, 1, 2]
weapon_rule = { two_handed = true, melee = true }
