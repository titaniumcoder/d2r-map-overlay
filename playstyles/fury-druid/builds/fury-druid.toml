# Source: Fury Druid (Werewolf, level 1-99: leveling and endgame in one build), computed from the D2R game tables (https://github.com/blizzhackers/d2data (D2R skills.json, skilldesc.json, runes.json, misc.json, weapons.json, uniqueitems.json, setitems.json, difficultylevels.json, hireling.json) + animdata.d2 from the local d2exp.mpq, agent-computed from the game data, not from a guide, updated 2026-11-23).
