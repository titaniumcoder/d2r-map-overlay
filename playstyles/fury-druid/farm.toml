# Farm list: gear to collect with any character for a planned build (agent-authored).
# An entry is "found" while a copy is on the character currently played (inventory, cube,
# personal stash, worn) and "done" once enough copies sit in the shared stash.
# Runewords also mark their missing runes on the dashboard's rune list.
# Hot-reloaded like the build files.
# Optional per entry: merc = true (for the mercenary of the group's build: its merc_act,
# Act 2 by default) and slot = "weapon" / "shield" /
# "helm" / "body" / ...: they steer a runeword's natural-socket base hint; note = "..." is
# shown with the entry.
# kind = "rolled" is any item of its slot carrying every stat in needs (skill names, as an
# oskill or as charges; "<tree> skills" for +skills to one class's skill tree): done once one is in the shared stash, found while the character has
# one (worn, inventory, cube, personal stash). An entry needing Teleport is hidden once
# Enigma is held (Enigma gives Teleport).

# The Fury Druid from level 1 (twinked by Vex), sorted by the level each piece is needed at,
# the merc's included (an Act 1 Cold Arrow rogue until Normal Act 5, then the Act 5 Frenzy
# Barbarian); the leveling runewords only from runes in the stash. Then the endgame core.
[[farm]]
for = "Fury Druid"
items = [
  { name = "Death's Hand", kind = "set" },
  { name = "Death's Guard", kind = "set" },
