notes = "Fury Werewolf from the optional skill reset at 75 (Summoner Druid with Raven Frost); standard = the user's core (Ribcracker, Fortitude, Jalal's Mane, Laying of Hands, Raven Frost; the merc's 2x Lawbringer, Smoke, Bulwark); the druid always fights two-handed. Durations, breakpoints and skill order computed from the D2R game tables, not from a guide."
targets = ["Lycanthropy duration: Werewolf form lasts 1000 + Lycanthropy(1000 + 500 per level after the first) frames: 40 s without Lycanthropy, 80 s at 1, +20 s per level, 300 s (5 min) at 12, 460 s at 20. Form life bonus 25% + Lycanthropy (20% + 5% per level): 45% at 1, 100% at 12, 140% at 20. Levels include +skills: Jalal's Mane (+2 druid, +2 shape shifting) turns 12 hard points into 16 = 380 s.", "Werewolf: Werewolf attack speed (skill IAS, diminishing 10..80): 20 at 1, 45 at 5, 51 at 7, 57 at 10, 64 at 15, 68 at 20; attack rating +50% +15% per level (335% at 20).", "Feral rage: Feral Rage (level 12): max charges 3 + level/2 (3 at 1, 4 at 2-3, 5 at 4, 8 at 10, 13 at 20); 4% life steal per charge (12/16/20/32/52%), run speed up to 32-55%, charges last 20 s. Life steal is divided by 2 in Nightmare and 3 in Hell (difficultylevels.json). The skill screen formula shows 4 to 4x level + 8% (equal to the charge formula only at levels 1-2): trust the screen in game.", "Fury: Fury (level 30, needs Rabies > Feral Rage > Werewolf): min(level + 1, 5) hits, so 5 hits from level 4; damage +100% +17% per level (423% at 20); attack rating +50% +10% per level. The current skills.json gives Fury no synergy, so 20 hard points is all of its scaling.", "Skill order: At 75 (86 points = 74 levels + 12 quest points, all of Normal/Nightmare/Hell done): Fury 20, Werewolf 20, Feral Rage 20, Lycanthropy 20, Rabies 1, Oak Sage 5. Fury 20 is all of Fury's scaling (no synergy); Werewolf 20 = +335% AR and 68 skill IAS; Feral Rage 20 = 13 charges, 52% life steal (17% in Hell); Lycanthropy 20 = 460 s form and +140% life in form, the same +5% life per point as Oak Sage plus duration, so it fills before Oak Sage. Then Oak Sage to 20 (76-90, +125% life for you and the merc), Rabies with the last 9 (91-99, poison for physical immunes).", "IAS: Werewolf attack frames (Feral Rage, normal attack, Fury's first hit), by effective Werewolf level and off-weapon IAS. Ribcracker (WSM 0, its 50% IAS counts undiminished in wolf form): 6 frames at Werewolf 1-2, 5 frames from Werewolf 3 with no other IAS (fastest of all candidates). Fury's middle hits roll the animation back 70% and are shorter; the tables can't give that sequence exactly.", "Core fit: From the data: Ribcracker is a two-handed Quarterstaff (level 31, 25 Str), the best werewolf weapon here thanks to the 50% weapon IAS. The druid fights two-handed only (user, 2026-11-20: full damage, never one-handed, no shield). Lawbringer is one-handed (sword/hammer/scepter, level 43): both copies go to an Act 5 merc that dual-wields two one-handed swords (the Frenzy Barbarian merc type, since D2R patch 2.4) until something better, very endgame; Act 2 mercs use polearms/spears. Smoke is always merc gear (the druid wears Fortitude, Stealth until then); Bulwark and Jalal's Mane are both helms: Jalal's Mane is a druid pelt, so Bulwark goes to the merc. Laying of Hands (Bramble Mitts, level 63, 20% IAS) is part of The Disciple set.", "Physical immunes: Fury only deals physical damage: skip physical immunes or leave them to the merc and Rabies (poison); each of the merc's Lawbringers adds 150-210 fire and 130-180 cold.", "Merc: Act 5 Barbarian dual-wielding both Lawbringers until something better, very endgame (user plan, 2026-11-20; replaces the summoner stage's Act 2 Might merc) — A Lawbringer merc must use swords: Act 3 or Act 5 (Act 2 mercs use polearms and spears). Both copies are planned as one-handed swords: the Act 5 Frenzy merc type dual-wields one-handed swords (D2R patch 2.4)."]
