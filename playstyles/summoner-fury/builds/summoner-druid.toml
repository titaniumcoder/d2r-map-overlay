name = "Summoner Druid"
damages = ["physical"]
notes = "Summoner Druid 1-99 (Ravens, Spirit Wolves, Dire Wolves, Grizzly, Oak Sage). From level 75 an optional skill reset into Fury (next stage), only once the switch gear is owned: a Cannot Be Frozen item, a powerful weapon, Harmony, two Lawbringers for the merc, Smoke and a life-leech merc helm; without it the summoner goes on to 99. Numbers computed from the D2R game tables (blizzhackers/d2data), not from a guide."
targets = ["Levels: level 6: Summon Spirit Wolf (reqlevel 6, needs Raven); level 18: Summon Dire Wolf + Heart of Wolverine (reqlevel 18; Dire Wolf needs Oak Sage and Spirit Wolf); level 30: Summon Grizzly (reqlevel 30, needs Dire Wolf); level 45: Raven Frost (ring, reqlevel 45): Cannot Be Frozen; one Cannot Be Frozen item is required for the Fury switch; level 51: Summon Grizzly 20 (+215% damage for the Spirit Wolves, Dire Wolves and the bear); level 60: Summon Spirit Wolf 20 with the Hell Den of Evil point (+500% attack rating, +200% defense for Dire Wolves and the Grizzly); level 75: optional switch to Fury once the switch gear (Cannot Be Frozen item, powerful weapon, Harmony, 2x Lawbringer for the merc, Smoke, life-leech merc helm) is owned: 86 skill points (74 from levels + 12 from Den of Evil, Radament and Izual in all three difficulties). Oak Sage 20 (+125% life) by now. Otherwise the summoner continues; level 90: Raven 20 (31 hits each, 73-94 base damage +720% from the 60 wolf/bear base levels); level 99: Arctic Blast 1 + Cyclone Armor 8 (Cyclone Armor reqlevel 12, needs Arctic Blast): absorbs 124 fire/cold/lightning damage per cast", "Skill points: 1 per level from level 2 plus quests: Den of Evil +1, Radament +1, Izual +2 per difficulty (12 in total). Level 40 = 39 + 4 (Normal) + 1 (Nightmare Den) = 44; level 75 = 74 + 12 = 86; level 99 = 98 + 12 = 110.", "Summons: From skills.json: Raven count min(lvl,5), 12+lvl-1 hits, damage +12% per Spirit/Dire Wolf/Grizzly base level. Spirit Wolf count min(lvl,5), its points give Dire Wolves and the Grizzly +25% attack rating and +10% defense each. Dire Wolf count min(lvl,3), damage 7-12 (lvl 1) / 15-24 (5) / 37-53 (12) / 85-109 (20), HP +60% at 1 to +535% at 20, and each Dire Wolf point gives Spirit Wolves and the Grizzly +15% life. Grizzly 30-60 base, its points give Spirit Wolves, Dire Wolves and itself +25% damage +10% per level. Spirit Wolves and Dire Wolves are separate pet types, so 5 + 3 + bear + 5 ravens fight together. Pet level is the character level (calc2 ulvl), so the summons keep up without points; points add the synergies above.", "Survival: Oak Sage: +30% life (+5%/level) for you, the merc and the pets (Oak Sage Aura); 20 points by 75 = +125%. Cyclone Armor (8 points from 92, after Arctic Blast 1) absorbs 40 + 12/level fire, cold and lightning damage per cast (124 at level 8), recast as it wears off. Heart of Wolverine (+20% damage +7%/level, +25% AR +7%/level) stays at 1 point: a Grizzly point gives +10% damage, more than Wolverine's +7%, and only one spirit is out at a time.", "Respec: optional, from 75 (Akara's free reset of any difficulty whose Den of Evil reward is still unused; stat points are refunded too): Fury 20, Werewolf 20, Feral Rage 20, Lycanthropy 20 (460 s form), Rabies 1, Oak Sage 5 = 86 points. Only once the switch gear (Cannot Be Frozen item, powerful weapon, Harmony, 2x Lawbringer for the merc, Smoke, life-leech merc helm) is owned; without it the summoner goes on to 99. Details in the Fury Druid stage.", "Merc: Act 2 Desert Mercenary: Normal Prayer, from Nightmare (level 40) Might — hireling.json: Normal Act 2 mercs have Prayer, Defiance or Blessed Aim; Might, Holy Freeze and Thorns only in Nightmare and Hell. Might raises physical damage of everyone in its radius (pets and, after the respec, the werewolf), so the same merc carries into the Fury stage."]
