# The shipped example playstyle: Summoner Druid, switching to Fury Druid from level 75.
# Selected in ~/.config/d2r-map-overlay/config.toml with `playstyle = "summoner-fury"` (the
# default). Any file of this folder copied to ~/.config/d2r-map-overlay/playstyle/ (same
# relative path, e.g. builds/fury-druid.toml or farm.toml) replaces the shipped one.
#
# The folder:
# - playstyle.toml   this file: name, description, valuables tiers, damage defaults;
# - builds/*.toml    the build definitions (agent-authored; generated by research/gen_build.py
#                    from the *.source.json next to them), hot-reloaded;
# - farm.toml        the cross-character farm list, hot-reloaded;
# - route.toml       the leveling and farming route (the dashboard's Next panel), hot-reloaded;
# - valuables.json   the ground-drop mark rules (compiled into the binary: rebuild after a
#                    change; no override).
# Which build each character follows (the /config page's selection) is state, not playstyle:
# ~/.local/share/d2r-map-overlay/bis.toml.

name = "Summoner Druid → Fury Druid"
description = "Summoner Druid 1-99, with an optional skill reset into Fury Werewolf from level 75 once the switch gear is owned."

[valuables]
# Ground drops matched by valuables.json get a ring around their marker, coloured by tier:
# S red, A orange, B yellow; dashed when the match is uncertain (unique/set name unknown, or the
# item's stats decide). List the tiers to highlight per category ("S", "A", "B").
# trade = items worth selling; twink = white runeword bases (e.g. a 4os Crystal Sword).
# A plain base with no enabled match isn't shown at all.
trade = ["S", "A"]
twink = ["S", "A"]

[damages]
# Damage types per character, primary first: colour the info line's area rating (immune
# monsters there). Optional: without an entry the selected build's `damages` count, else the
# class default build's. Names: physical, magic, fire, lightning, cold, poison.
# Per character name:   Somebody = ["fire", "physical"]
# Per class (id or name): [damages.class] druid = ["physical"]
