# The leveling and farming route (user, 2026-11-20): what the dashboard's "Next" panel shows.
# Hot-reloaded; copy to ~/.config/d2r-map-overlay/playstyle/route.toml to change it.
#
# The current step is the FIRST [[step]] whose `when` holds and whose `done_when` doesn't.
# Conditions (all given ones must hold; an empty `when` always holds, no `done_when` = never
# done):
#   difficulty  = "normal" | "nightmare" | "hell"
#   level_min   = N   character level N or more
#   level_below = N   character level below N
#   quests_done = "<quest set>" or ["<quest>", ...]   every one done (in `difficulty` when the
#                 condition names one, else in the current difficulty; remembered per
#                 character and difficulty, quest names as the game's quest log)
#   options     = ["<option>", "!<option>"]   [options] switches on (or off, with "!")
#   not_worth   = true   none of the step's `worth` bosses can drop a missing farm-list item
# What to do (any mix):
#   farm      = ["<area>", ...]            areas to run
#   quests    = "<quest set>" or [...]     the dashboard lists the ones still missing
#   rush      = "<target>"                 rush to it (with `quests`: the ones on the way)
#   [[step.boss]] name = "<boss>"          worth = true (default): shown while worth farming,
#                 with the items it can drop; worth = false: just kill it.
#                 late_from = N, late_note = "...": the note from character level N on.
#   max_areas = true   the level-85 Hell areas where no monster is immune to the build's
#                      primary damage
#   note      = "..."  why / hints

[options]
# Baal waves in Nightmare for XP before Hell.
nm_baal_waves = true

[quest_sets]
canyon = ["Sisters to the Slaughter", "Tainted Sun", "Arcane Sanctuary", "The Summoner"]
mephisto = [
  "Sisters to the Slaughter", "The Horadric Staff", "Tainted Sun", "Arcane Sanctuary",
  "The Summoner", "The Seven Tombs", "Khalim's Will",
]
ancients = ["The Horadric Staff", "The Seven Tombs", "Khalim's Will", "The Guardian", "Terror's End"]
valuable = [
  "Den of Evil", "Radament's Lair", "The Fallen Angel", "Prison of Ice", "Siege on Harrogath",
  "Hell's Forge",
]

# --- Normal ---------------------------------------------------------------------------------

[[step]]
id = "normal-tristram"
title = "Tristram or the Countess until 15"
when = { difficulty = "normal", level_below = 15 }
farm = ["Tristram", "Forgotten Tower (the Countess)"]

[[step]]
id = "normal-canyon"
title = "Quests to open the Tombs"
when = { difficulty = "normal" }
done_when = { quests_done = "canyon" }
quests = "canyon"
note = "The minimum only."

[[step]]
id = "normal-tombs"
title = "Tal Rasha's Tombs until 24"
when = { difficulty = "normal", level_below = 24 }
farm = ["Tal Rasha's Tombs"]

[[step]]
id = "normal-ancients"
title = "Quests up to the Ancients"
when = { difficulty = "normal" }
done_when = { quests_done = "ancients" }
quests = "ancients"
note = "The minimum only."

[[step]]
id = "normal-baal"
title = "Baal runs until 35"
when = { difficulty = "normal", level_below = 35 }
farm = ["Throne of Destruction (Baal waves)"]

[[step]]
id = "normal-valuable"
title = "The Normal quests worth having"
when = { difficulty = "normal" }
done_when = { quests_done = "valuable" }
quests = "valuable"
note = "Larzuk's socket is kept for an eth Ribcracker / Tomb Reaver + Zod: don't use it on a runeword base."

# --- Nightmare ------------------------------------------------------------------------------

[[step]]
id = "nm-cain"
title = "Nightmare: rescue Cain"
when = { difficulty = "nightmare" }
done_when = { quests_done = ["The Search for Cain"] }
quests = ["The Search for Cain"]

[[step]]
id = "nm-countess"
title = "The Countess until 45"
when = { difficulty = "nightmare", level_below = 45 }
farm = ["Forgotten Tower (the Countess)"]
note = "Runes up to Ko."

[[step]]
id = "nm-rush-mephisto"
title = "Rush to Mephisto"
when = { difficulty = "nightmare" }
done_when = { quests_done = "mephisto" }
rush = "Mephisto"
quests = "mephisto"

[[step]]
id = "nm-bosses"
title = "Mephisto / Andariel while worth farming, until 57"
when = { difficulty = "nightmare", level_below = 57 }
done_when = { not_worth = true }
note = "Run them while they can drop something still missing from the farm list."

[[step.boss]]
name = "Mephisto"

[[step.boss]]
name = "Andariel"
late_from = 55
late_note = "items only, little XP"

[[step]]
id = "nm-diablo"
title = "Finish Diablo"
when = { difficulty = "nightmare" }
done_when = { quests_done = ["The Guardian", "Terror's End"] }
quests = ["The Guardian", "Terror's End"]
note = "Not worth farming: kill him once and move on."

[[step]]
id = "nm-ancients"
title = "The Ancients"
when = { difficulty = "nightmare" }
done_when = { quests_done = ["Rite of Passage"] }
quests = ["Rite of Passage"]

[[step]]
id = "nm-baal"
title = "Baal waves, Shenk and Eldritch for XP"
when = { difficulty = "nightmare", options = ["nm_baal_waves"] }
farm = [
  "Throne of Destruction (Baal waves)", "Bloody Foothills (Shenk)",
  "Frigid Highlands (Eldritch)",
]
note = "Baal himself isn't worth farming; the waves are good XP. Shenk (61) and Eldritch (62) give full XP from 57. Kill Baal (Eve of Destruction) to open Hell."

# --- Hell -----------------------------------------------------------------------------------

[[step]]
id = "hell-countess"
title = "Hell: the Countess"
when = { difficulty = "hell" }
done_when = { not_worth = true }

[[step.boss]]
name = "The Countess"

[[step]]
id = "hell-max-areas"
title = "Max areas"
when = { difficulty = "hell", level_min = 75 }
max_areas = true
note = "Terror zones can't be read yet: only whether the current area is terrorized (the info line). A terrorized one of these first."

[[step]]
id = "hell-basic"
title = "Hell below 75: the Nightmare-style route"
when = { difficulty = "hell" }
farm = ["Throne of Destruction (Baal waves)", "Bloody Foothills (Shenk)", "Frigid Highlands (Eldritch)"]
note = "Until 75, then the max areas."

[[step.boss]]
name = "Mephisto"

[[step.boss]]
name = "Andariel"
