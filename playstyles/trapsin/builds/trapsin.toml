[[tips]]
levels = "38-45"
text = "Reset at Akara at 38 before Act 4 Nightmare (the switch note's allocation)."

[[tips]]
levels = "38-45"
text = "5 Lightning Sentries on one spot, then 2-3 Death Sentries once the first monsters die; Cloak of Shadows / Mind Blast for crowd control; keep Burst of Speed up."

[[tips]]
levels = "38-45"
text = "Lower Resist (the wand) on tanky and lightning-immune monsters until the first corpses; skip what Death Sentry can't kill (Teleport past the Maggot Lair and parts of Act 3)."

[[tips]]
levels = "38-45"
text = "Chaos Sanctuary: Grand Vizier of Chaos is always lightning immune; drag corpses onto immune seal bosses and blow them up, or reset the area."

[[tips]]
levels = "38-45"
text = "The Ancients: drop 1-2 inventories of potions in the arena, recharge the wand, reset Ancients with Magic Resistant / Lightning Enchanted / Spectral Hit; kill Talic and Korlic first, fight Madawc around a pillar with Lower Resist."

[[tips]]
levels = "45-99"
text = "From 45: two Cunning Greater Talons of Quickness (+3 Traps) from Anya in Nightmare / Hell, unsocketed (no socket quest)."

[[tips]]
levels = "45-99"
text = "Start runs with Battle Command twice and Battle Orders from Call to Arms, then the swap with the most +skills for Burst of Speed."

[[tips]]
levels = "45-99"
text = "MIN-MAX: swap to Crescent Moon right after laying the Lightning Sentries and stay there until the traps are done."

[[tips]]
levels = "45-99"
text = "Keep the merc close to the fight for Infinity's Conviction; Fire Blast on lightning and physical immunes."
